* { box-sizing: border-box }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: grid; grid-template-columns: minmax(0,1fr); place-items: center; padding: clamp(14px,4vw,56px); background: #f1f2ee; color: #24392e; font-family: "DM Sans", Arial, sans-serif }
main { width: min(100%,1060px); min-width: 0; background: #fff; border: 1px solid #d9dbd1; border-radius: 24px; padding: clamp(16px,3vw,38px); box-shadow: 0 16px 48px #26382c10 }
header, footer { display: flex; align-items: center; justify-content: space-between; gap: 16px }
header { padding-bottom: 22px; font: 620 .9rem/1.4 "DM Sans",sans-serif; letter-spacing: -.01em }
main { --accent: #39664c }
main[data-projeto="EducaSim"] { --accent: #245574 }
main[data-projeto="Patinhas Felizes"] { --accent: #875f43 }
header span:first-child { display: flex; align-items: center; gap: 9px }
header span:first-child::before { content: ""; width: 16px; height: 4px; border-radius: 2px; background: var(--accent) }
.counter { font-variant-numeric: tabular-nums; color: #536557 }
article { display: grid; grid-template-columns: minmax(0, .88fr) minmax(0, 1.12fr); gap: clamp(24px,5vw,70px); align-items: center; touch-action: pan-y pinch-zoom }
figure { margin: 0; position: relative; align-self: center; width: 100%; min-width: 0; aspect-ratio: 3 / 2; background: #f4f7f0; border-radius: 18px }
figure { overflow: hidden }
.logo-track { position: absolute; inset: 0; pointer-events: none }

figure img { position: absolute; inset: 0; display: block; width: 100%; height: 100%; padding: clamp(16px,3vw,36px); object-fit: contain }
.logo-track img[data-logo="Mural de Ações do Bairro · Vila Nova"] { padding: 0; object-fit: contain }
article[data-projeto="Refloreser · Laboratório do consumo da sua casa"] figure, .logo-track img[data-logo="Refloreser · Laboratório do consumo da sua casa"] { background-color: #f2f6ed }
body[data-projeto="Refloreser · Laboratório do consumo da sua casa"] { background-color: #e7efe3 }
.logo-track img { background: #f4f7f0 }
article[data-projeto="EducaSim"] figure, .logo-track img[data-logo="EducaSim"] { background-color: #fafbf8 }
body[data-projeto="EducaSim"] { background-color: #e4edf1 }
article[data-projeto="Refloreser"] figure, .logo-track img[data-logo="Refloreser"] { background-color: #e4dff5 }
body[data-projeto="Refloreser"] { background-color: #f1edf8 }
article[data-projeto="Zootopia Pet"] figure, .logo-track img[data-logo="Zootopia Pet"] { background-color: #fceee3 }
body[data-projeto="Zootopia Pet"] { background-color: #f9e8d9 }
article[data-projeto="Patinhas Felizes"] figure, .logo-track img[data-logo="Patinhas Felizes"] { background-color: #d4e4f4 }
body[data-projeto="Patinhas Felizes"] { background-color: #eaf1f7 }
article[data-projeto="Aprender Junto"] figure, .logo-track img[data-logo="Aprender Junto"] { background-color: #d6e9cf }
body[data-projeto="Aprender Junto"] { background-color: #e7efe3 }
article[data-projeto="Mural de Ações do Bairro · Vila Nova"] figure, .logo-track img[data-logo="Mural de Ações do Bairro · Vila Nova"] { background-color: #162b3b }
body[data-projeto="Mural de Ações do Bairro · Vila Nova"] { background-color: #dce4e8 }
article[data-projeto="EcoLuz"] figure, .logo-track img[data-logo="EcoLuz"] { background-color: #090f1f }
body[data-projeto="EcoLuz"] { background-color: #d6d9e5 }
body { transition: background-color var(--slide-time, 320ms) ease }
section { padding: 16px 0; min-width: 0; overflow-wrap: anywhere }
h1 { margin: 0; font-size: clamp(2.45rem,4.4vw,3.75rem); font-weight: 720; line-height: 1.04; letter-spacing: -.055em; color: #1d2724; text-wrap: balance }
.description { margin-top: clamp(14px, 2vw, 22px); max-width: 56ch; font-size: 1rem; line-height: 1.6; color: #43504d }
.description p { margin: 0 }
.slide-copy { display: grid; grid-template-columns: minmax(0,1fr) }
.slide-copy > * { grid-area: 1 / 1; align-self: center }
.slide-copy > [aria-hidden="true"] { visibility: hidden }
.description .text-row + .slide-copy { margin-top: .85em }
footer { justify-content: center; margin-top: 22px; border-top: 1px solid #d7dbd1; padding-top: 14px }
.dots { position: relative; display: flex; justify-content: center; align-items: center; flex-wrap: wrap }
button { cursor: pointer; color: inherit; background: transparent; border: 0 }
button:focus-visible { outline: 3px solid #487e58; outline-offset: 2px }
.dot { width: 44px; height: 44px; padding: 0; display: grid; place-items: center }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; transition: width .24s ease, background-color .24s ease; background: #aeb7b3 }
.marker { position: absolute; top: 0; left: 0; width: 18px; height: 8px; border-radius: 8px; pointer-events: none; background: var(--accent); transition: transform .4s cubic-bezier(.22,.8,.2,1), background-color .28s }
.dot[aria-current="true"]::before { visibility: hidden }
@media (max-width: 760px) {
  body { padding: clamp(10px,3vw,22px) }
  main { max-width: 560px; border-radius: 20px; padding: clamp(15px,4vw,24px) }
  article { grid-template-columns: minmax(0,1fr); gap: 0 }
  figure { border-radius: 13px }
  section { padding: 20px 1px 0 }
  h1 { font-size: clamp(2rem,8vw,3rem) }
  header { padding-bottom: 14px }
  footer { margin-top: 16px; padding-top: 4px }
}
@media (orientation: landscape) and (max-height: 540px) and (min-width: 600px) {
  body { padding: 10px }
  main { max-width: 1000px; padding: 16px 22px }
  article { grid-template-columns: minmax(0,.65fr) minmax(0,1.35fr); gap: 24px }
  section { padding: 0 }
  header { padding-bottom: 10px }
  h1 { font-size: 2.1rem }
  footer { margin-top: 10px; padding-top: 0 }
}
main { --slide-time: 320ms }
.logo-track.settling { transition: transform var(--slide-time) cubic-bezier(.22,.8,.22,1) }
section.entering { animation: reveal var(--slide-time) ease-out }
@keyframes reveal { from { opacity: .55 } to { opacity: 1 } }
@media (prefers-reduced-motion: reduce) {
  main { --slide-time: 120ms }
  .marker { transition-duration: 120ms }
}
</style>

const select = selector => document.querySelector(selector);
const card = select("main");
const slide = select("article");
const count = projetos.length;
let current = 0;
let timer;
let hovering = false;
let touchStart = null;

// Os textos compartilham a mesma célula para manter estável a altura do card.
const copies = projetos.map(project => {
  const copy = document.createElement("div");
  const heading = document.createElement("h1");
  heading.textContent = project.nome;
  const description = document.createElement("div");
  description.className = "description";
  for (const text of project.explicacao.split(/\n\s*\n/)) {
    const paragraph = document.createElement("p");
    paragraph.textContent = text;
    description.append(paragraph);
  }
  copy.append(heading, description);
  select(".slide-copy").append(copy);
  return copy;
});

const dots = projetos.map((project, index) => {
  const dot = document.createElement("button");
  dot.className = "dot";
  dot.setAttribute("aria-label", "Mostrar " + project.nome);
  dot.onclick = () => show(index);
  select(".dots").append(dot);
  return dot;
});

const track = select(".logo-track");
// Espaço entre imagens para evitar vazamento de cor em larguras fracionárias.
const slideGap = 3;
// Duas cópias nas extremidades mantêm o percurso contínuo ao fechar a volta.
const sequence = [projetos[count - 1], ...projetos, projetos[0]];
sequence.forEach((project, slot) => {
  const img = document.createElement("img");
  img.src = project.logo;
  img.alt = "";
  img.draggable = false;
  img.dataset.logo = project.nome;
  img.style.left = "calc(" + slot * 100 + "% + " + slot * slideGap + "px)";
  track.append(img);
});
let slot = 1;
function positionTrack(dx = 0) {
  track.style.transform = "translateX(calc(" + (-slot * 100) + "% + " + (dx - slot * slideGap) + "px))";
}
positionTrack();
function normalizeSlot() {
  if (slot !== 0 && slot !== count + 1) return;
  track.classList.remove("settling");
  slot = current + 1;
  positionTrack();
  track.getBoundingClientRect();
}
track.addEventListener("transitionend", event => {
  if (event.target === track && event.propertyName === "transform") normalizeSlot();
});
const marker = document.createElement("span");
marker.className = "marker";
marker.setAttribute("aria-hidden", "true");
select(".dots").append(marker);
function placeMarker() {
  const dot = dots[current];
  marker.style.transform = "translate(" + (dot.offsetLeft + (dot.offsetWidth - marker.offsetWidth) / 2) + "px," +
    (dot.offsetTop + (dot.offsetHeight - marker.offsetHeight) / 2) + "px)";
}
if ("ResizeObserver" in window) {
  new ResizeObserver(placeMarker).observe(select(".dots"));
} else {
  window.addEventListener("resize", placeMarker);
}

function schedule() {
  clearTimeout(timer);
  if (count > 1 && !hovering && !document.hidden && !keyboardFocus && !touchStart) {
    timer = setTimeout(() => show(current + 1), 10000);
  }
}

function show(index, dragOffset = 0) {
  touchStart = null;
  normalizeSlot();
  const next = (index + count) % count;
  const changed = current !== next;
  current = next;
  const project = projetos[current];
  document.body.dataset.projeto = card.dataset.projeto = slide.dataset.projeto = project.nome;
  select("figure").setAttribute("aria-label", "Logo do projeto " + project.nome);
  placeMarker();
  const content = select("section");
  if (changed) {
    content.classList.remove("entering");
    content.getBoundingClientRect();
    content.classList.add("entering");
  }
  if (changed || dragOffset) track.classList.add("settling");
  slot = index + 1;
  positionTrack();
  copies.forEach((copy, i) => copy.setAttribute("aria-hidden", String(i !== current)));
  select(".counter").textContent = [current + 1, count].map(n => String(n).padStart(2, "0")).join(" / ");
  dots.forEach((dot, i) => dot.setAttribute("aria-current", String(i === current)));
  schedule();
}

document.addEventListener("keydown", event => {
  if (count < 2 || event.altKey || event.metaKey || event.ctrlKey) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    event.preventDefault();
    show(current + (event.key === "ArrowRight" ? 1 : -1));
  }
});
card.addEventListener("pointerenter", event => {
  if (event.pointerType === "mouse") { hovering = true; schedule(); }
});
card.addEventListener("pointerleave", event => {
  if (event.pointerType === "mouse") { hovering = false; schedule(); }
});
let keyboardFocus = false;
let keyboardInput = false;
document.addEventListener("keydown", () => {
  keyboardInput = true;
  keyboardFocus = card.contains(document.activeElement);
  schedule();
});
document.addEventListener("pointerdown", () => { keyboardInput = false; keyboardFocus = false; schedule(); });
card.addEventListener("focusin", event => {
  keyboardFocus = keyboardInput && event.target.matches("button");
  schedule();
});
card.addEventListener("focusout", () => { keyboardFocus = false; schedule(); });
document.addEventListener("visibilitychange", schedule);
slide.addEventListener("pointerdown", event => {
  if (!event.isPrimary || event.button !== 0 || count < 2) return;
  normalizeSlot();
  track.classList.remove("settling");
  touchStart = {id: event.pointerId, x: event.clientX, y: event.clientY, dx: 0, dragging: false};
  slide.setPointerCapture(event.pointerId);
  schedule();
});
slide.addEventListener("pointermove", event => {
  if (!touchStart || event.pointerId !== touchStart.id) return;
  const dx = event.clientX - touchStart.x;
  const dy = event.clientY - touchStart.y;
  if (!touchStart.dragging) {
    if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
    touchStart.dragging = true;
  }
  const width = track.clientWidth;
  touchStart.dx = Math.max(-width, Math.min(width, dx));
  positionTrack(touchStart.dx);
});
function finishDrag(event) {
  if (!touchStart || event.pointerId !== touchStart.id) return;
  const dx = touchStart.dx;
  const commit = event.type === "pointerup" && touchStart.dragging &&
    Math.abs(dx) >= Math.min(48, track.clientWidth * .18);
  show(commit ? current - Math.sign(dx) : current, dx);
}
slide.addEventListener("pointerup", finishDrag);
slide.addEventListener("pointercancel", finishDrag);
slide.addEventListener("lostpointercapture", finishDrag);
show(0);
</script>
